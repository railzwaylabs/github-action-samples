services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      args:
        VERSION: local
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders?sslmode=disable
      ENVIRONMENT: development
      PORT: "8080"
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        VERSION: local
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders?sslmode=disable
      ENVIRONMENT: development
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PROFILING_ENABLED: "true"
      PROFILING_ADDRESS: "0.0.0.0:6060"
    ports:
      - "8080:8080"
      - "6060:6060"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/sample/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
